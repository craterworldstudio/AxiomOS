name: Build NoTryOS

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NASM
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Assemble bootloader
        run: nasm -f bin src/boot.asm -o boot.bin

      - name: Check boot sector size
        run: |
          size=$(stat -c%s boot.bin)
          if [ "$size" -ne 512 ]; then
            echo "Boot sector must be exactly 512 bytes, got $size bytes"
            exit 1
          fi

      - name: Upload boot sector
        uses: actions/upload-artifact@v4
        with:
          name: NoTryOS-boot
          path: boot.bin
